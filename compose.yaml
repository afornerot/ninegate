services:
  postgres:
    image: postgres:17-alpine
    container_name: ninegate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ninegate
      POSTGRES_USER: user
      POSTGRES_PASSWORD: changeme
    volumes:
      - ./volume/postgres:/var/lib/postgresql/data
  ninegate:
    image: ghcr.io/afornerot/ninegate
    container_name: ninegate
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./misc/docker/Dockerfile
    depends_on:
      - postgres
    ports:
      - "8019:80"
    volumes:
      - ./src:/app/src:delegated
      - ./templates:/app/templates:delegated
      - ./config:/app/config:delegated
      - ./public/uploads:/app/public/uploads:delegated
      - ./public/bundles:/app/public/bundles:delegated
      - ./uploads:/app/uploads:delegated
      - ./misc:/app/misc:delegated
      - ./public/lib:/app/public/lib:delegated
      - ./public/medias:/app/public/medias:delegated
      - ./.env.local:/app/.env.local
      - ./volume/dex:/app/volume/dex
      - ./volume/glauth:/app/volume/glauth
      - ../bNine-FilesBundle/src:/app/vendor/bnine/filesbundle/src:delegated
      - ../bNine-FilesBundle/templates:/app/vendor/bnine/filesbundle/templates:delegated
      - ../bNine-FilesBundle/Resources/public:/app/vendor/bnine/filesbundle/Resources/public:delegated
  adminer:
    image: adminer
    container_name: ninegate-adminer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - 6019:8080
  mailhog:
    image: mailhog/mailhog
    container_name: ninegate-mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
  glauth:
    image: ghcr.io/glauth/glauth-plugins:v2.4.0
    container_name: ninegate-glauth
    restart: unless-stopped
    depends_on:
      - postgres
      - ninegate
    ports:
      - "389:3893"
    volumes:
      - ./volume/glauth:/app/config
  rustfs:
    image: rustfs/rustfs:latest
    container_name: ninegate-rustfs
    restart: unless-stopped
    profiles:
      - s3
    environment:
      - RUSTFS_ACCESS_KEY=rustfs
      - RUSTFS_SECRET_KEY=changeme
      - RUSTFS_CONSOLE_ENABLE=true
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./volume/rustfs:/data

