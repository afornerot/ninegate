# ============================================================
# OpenLDAP Server Configuration
# Généré depuis misc/docker/openldap/template-slapd.conf
# Les variables ${...} sont interpolées par envsubst au démarrage
# ============================================================

# Inclusion des schémas de base (chemins Alpine)
include         /etc/openldap/schema/core.schema
include         /etc/openldap/schema/cosine.schema
include         /etc/openldap/schema/inetorgperson.schema
include         /etc/openldap/schema/nis.schema

# Modules
modulepath      /usr/lib/openldap
moduleload      back_mdb.so
moduleload      memberof.so
moduleload      unique.so

# Configuration root (admin cn=config)
# ============================================================

pidfile         /var/run/openldap/slapd.pid
argsfile        /var/run/openldap/slapd.args

# Root password pour cn=config (généré au runtime via slappasswd)
database        config
rootdn          cn=admin,cn=config
rootpw          __CONFIG_ROOT_HASH__

# Base de données principale
# ============================================================

database        mdb
maxsize         1073741824
suffix          "${LDAP_BASEDN}"
rootdn          "${LDAP_WRITER_DN}"
rootpw          __WRITER_HASH__

# Stockage (volume monté sur /var/lib/openldap via compose)
directory       /var/lib/openldap/openldap-data

# Index pour optimiser les recherches
index           objectClass                        eq
index           cn,sn,givenname,mail,uid           eq,sub,pres
index           uidNumber,gidNumber                eq
index           ${LDAP_ATTR_GROUP_MEMBER}          eq

# Overlays
# ============================================================

# MemberOf : maintient automatiquement l'attribut memberOf sur les users
# quand ils sont ajoutés/retirés d'un groupe
overlay         memberof

# Unique : empêche les doublons sur uid et mail
overlay         unique
unique_uri      ldap:///?uid?sub
unique_uri      ldap:///?mail?sub

# ACL : accès complet pour le writer, lecture pour les utilisateurs authentifiés
# ============================================================

access to *
    by dn.base="${LDAP_WRITER_DN}" write
    by dn.base="cn=admin,cn=config" write
    by users read
    by anonymous auth

# Logs
loglevel        256