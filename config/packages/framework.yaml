# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    session:
        handler_id: 'session.handler.pdo'
        # Cookie propre à cette application : plusieurs apps PHP partagent le
        # même hôte sur des ports différents et un navigateur n'isole pas les
        # cookies par port. Le PHPSESSID par défaut serait écrasé par une autre
        # app, ce qui déconnecte l'utilisateur de ninegate.
        name: NINEGATESESSID
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax
        cookie_lifetime: 3600
        gc_maxlifetime: 3600

    # Proxies de confiance : renseigner TRUSTED_PROXIES (IP/CIDR des proxies)
    # uniquement quand l'app est servie derrière un reverse proxy.
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto']

    #esi: true
    #fragments: true

    # Choix explicite : on conserve le comportement actuel (le défaut passera à true en 8.0)
    property_info:
        with_constructor_extractor: false

when@dev:
    framework:
        profiler:
            # Recommandé par Symfony 7.3+ (le défaut passera à true)
            collect_serializer_data: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
