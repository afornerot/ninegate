# Read the documentation at https://github.com/thephpleague/flysystem-bundle/blob/master/docs/1-getting-started.md
flysystem:
    storages:
        default.storage:
            # Format « discoverable » (flysystem-bundle >= 3.5) : le type d'adaptateur
            # est la clé, ses options sont en dessous. L'ancien format adapter/options
            # est déprécié.
            local:
                directory: '%kernel.project_dir%/var/storage/default'
