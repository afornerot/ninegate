parameters:
  appEnv: "%env(resolve:APP_ENV)%"
  appSecret: "%env(resolve:APP_SECRET)%"
  appName: "%env(resolve:APP_NAME)%"
  appNoreply: "%env(resolve:APP_NOREPLY)%"
  appAdmin: "%env(resolve:APP_ADMIN)%"
  appAdminPassword: "%env(resolve:APP_ADMIN_PASSWORD)%"
  appModeAuth: "%env(resolve:APP_MODEAUTH)%"
  appMasterIdentity: "%env(resolve:APP_MASTERIDENTITY)%"
  syncIdentity: "%env(resolve:SYNC_IDENTITY)%"
  databaseUrl: "%env(resolve:DATABASE_URL)%"
  defaultUri: "%env(resolve:DEFAULT_URI)%"
  oidcIssuer: "%env(resolve:OIDC_ISSUER)%"
  oidcClientId: "%env(resolve:OIDC_CLIENTID)%"
  oidcClientSecret: "%env(resolve:OIDC_CLIENTSECRET)%"
  oidcRedirectUri: "%env(resolve:OIDC_REDIRECTURI)%"
  oidcMailAttribute: "%env(resolve:OIDC_MAILATTRIBUTE)%"
  oidcUsernameAttribute: "%env(resolve:OIDC_USERNAMEATTRIBUTE)%"
  oidcFirstnameAttribute: "%env(resolve:OIDC_FIRSTNAMEATTRIBUTE)%"
  oidcLastnameAttribute: "%env(resolve:OIDC_LASTNAMEATTRIBUTE)%"
  casHost: "%env(resolve:CAS_HOST)%"
  casPort: "%env(resolve:CAS_PORT)%"
  casPath: "%env(resolve:CAS_PATH)%"
  casUsername: "%env(resolve:CAS_USERNAME)%"
  casMail: "%env(resolve:CAS_MAIL)%"
  casLastname: "%env(resolve:CAS_LASTNAME)%"
  casFirstname: "%env(resolve:CAS_FIRSTNAME)%"
  ldapBase: "%env(resolve:LDAP_BASEDN)%"
  ldapUsersDn: "%env(resolve:LDAP_USERSDN)%"
  ldapGroupsDn: "%env(resolve:LDAP_GROUPSDN)%"
  ldapHost: "%env(resolve:LDAP_HOST)%"
  ldapPort: "%env(int:LDAP_PORT)%"
  ldapTls: "%env(bool:LDAP_TLS)%"
  ldapAttrUsername: "%env(resolve:LDAP_ATTR_USERNAME)%"
  ldapAttrLastname: "%env(resolve:LDAP_ATTR_LASTNAME)%"
  ldapAttrFirstname: "%env(resolve:LDAP_ATTR_FIRSTNAME)%"
  ldapAttrEmail: "%env(resolve:LDAP_ATTR_EMAIL)%"
  ldapAttrPassword: "%env(resolve:LDAP_ATTR_PASSWORD)%"
  ldapAttrGroupCn: "%env(resolve:LDAP_ATTR_GROUP_CN)%"
  ldapAttrGroupMember: "%env(resolve:LDAP_ATTR_GROUP_MEMBER)%"
  ldapAttrGroupGid: "%env(resolve:LDAP_ATTR_GROUP_GID)%"
  ldapWriterDn: "%env(resolve:LDAP_WRITER_DN)%"
  ldapWriterPassword: "%env(resolve:LDAP_WRITER_PASSWORD)%"
  storageDsn: "%env(resolve:STORAGE_DSN)%"
  s3Endpoint: "%env(resolve:S3_ENDPOINT)%"
  s3Bucket: "%env(resolve:S3_BUCKET)%"
  s3AccessKey: "%env(resolve:S3_ACCESS_KEY)%"
  s3SecretKey: "%env(resolve:S3_SECRET_KEY)%"
  s3Region: "%env(resolve:S3_REGION)%"

services:
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    Symfony\Component\DependencyInjection\ContainerInterface: '@service_container'

    # Pour l'orchestrateur IdentitySyncCommand — injection via alias
    Symfony\Component\Console\Application: '@console.messenger.application'

    # Symfony LDAP adapter
    Symfony\Component\Ldap\Adapter\AdapterInterface:
        class: Symfony\Component\Ldap\Adapter\ExtLdap\Adapter
        factory: ['App\Service\LdapAdapterFactory', 'create']
        arguments: ['@parameter_bag']

    App\Service\ConfigParameterBag:
        arguments: ['@App\Repository\ConfigRepository']

    App\Service\PageParameterBag:
        class: App\Service\PageParameterBag
        arguments: ['@App\Repository\PageRepository', '@security.token_storage', '@App\Repository\BlogRepository', '@App\Repository\CalendarRepository']

    App\:
        resource: '../src/'

    App\Repository\UserRepository:
        public: true

    App\Repository\CalendarRepository:
        public: true

    App\Repository\CalendarEventRepository:
        public: true

    App\Repository\TacheRepository:
        public: true

    App\EventListener\UserAllListener:
        tags:
            - { name: doctrine.event_listener, event: doctrine.orm.entity_listener }
            - { name: doctrine.event_listener, event: postFlush }

    Bnine\FilesBundle\Service\FileService:
        arguments:
            $storage: '@app_storage'
            $s3: '%env(bool:STORAGE_S3)%'

    Bnine\FilesBundle\Cache\CachePolicyInterface: '@App\Cache\FileCachePolicy'

    League\Flysystem\FilesystemOperator: '@app_storage'

    app_storage:
        class: League\Flysystem\FilesystemOperator
        factory: ['App\Service\StorageFactory', 'create']
        arguments: ['@parameter_bag']

    session.handler.pdo:
        class: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler
        factory: ['App\Service\PdoSessionHandlerFactory', 'create']
        arguments: ['@doctrine.dbal.default_connection']

